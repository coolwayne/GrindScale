name: Deploy LIFF to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/liff/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/liff/package-lock.json

      - name: Install and build
        working-directory: web/liff
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_LIFF_ID: ${{ secrets.VITE_LIFF_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/liff/dist --project-name=grindscale-liff --branch=main
